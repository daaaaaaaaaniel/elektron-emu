name: Syntakt AU

on:
  push:
    branches: [main, feat/syntakt-au-xcodegen]
    paths:
      - Syntakt/**
      - .github/workflows/syntakt-au.yml
  pull_request:
    paths:
      - Syntakt/**
      - .github/workflows/syntakt-au.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntakt-au-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal AU on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Set build paths
        run: |
          echo "ST_AU_WORK=$RUNNER_TEMP/syntakt-au" >> "$GITHUB_ENV"
          echo "AU_LOGS=$RUNNER_TEMP/syntakt-au-logs" >> "$GITHUB_ENV"
          echo "AU_PACKAGE=$RUNNER_TEMP/syntakt-au-package" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/syntakt-au-logs" "$RUNNER_TEMP/syntakt-au-package"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare build tools and record versions
        run: |
          mkdir -p "$AU_LOGS" "$AU_PACKAGE"
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          for tool in cmake ninja python3; do
            command -v "$tool"
          done
          {
            git rev-parse HEAD
            uname -m
            sw_vers
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
            cmake --version
            ninja --version
            python3 --version
            xcodegen --version
          } | tee "$AU_LOGS/toolchain.txt"

      - name: Check build orchestration
        run: python3 -m unittest discover -s Syntakt/tests -v 2>&1 | tee "$AU_LOGS/tests.log"

      - name: Build patched dependencies for Intel and ARM
        run: bash Syntakt/source/vst/scripts/bootstrap-au-mac.sh "$ST_AU_WORK" 2>&1 | tee "$AU_LOGS/bootstrap.log"

      - name: Generate Xcode project
        working-directory: Syntakt
        run: xcodegen generate --spec project.yml 2>&1 | tee "$AU_LOGS/xcodegen.log"

      - name: Build universal component with Xcode
        working-directory: Syntakt
        run: |
          xcodebuild -project SyntaktAU.xcodeproj -scheme Syntakt-AU \
            -configuration Release "ST_AU_WORK=$ST_AU_WORK" \
            -resultBundlePath "$AU_LOGS/Syntakt-AU.xcresult" \
            build 2>&1 | tee "$AU_LOGS/build.log"

      - name: Verify and package component
        run: |
          bundle="$ST_AU_WORK/build/bin/syntakt.component"
          binary="$bundle/Contents/MacOS/syntakt"
          lipo "$binary" -verify_arch x86_64 arm64
          codesign --verify --strict "$bundle"
          plutil -lint "$bundle/Contents/Info.plist"
          {
            git rev-parse HEAD
            lipo -archs "$binary"
            otool -L "$binary"
            codesign -dvv "$bundle" 2>&1
          } | tee "$AU_LOGS/component.txt"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$AU_PACKAGE/Syntakt-AU-universal.zip"
          cp "$AU_LOGS/toolchain.txt" "$AU_PACKAGE/toolchain.txt"
          cp "$AU_LOGS/component.txt" "$AU_PACKAGE/component.txt"
          cp Syntakt/AU-BUILD.md "$AU_PACKAGE/AU-BUILD.md"
          shasum -a 256 "$AU_PACKAGE/Syntakt-AU-universal.zip" | tee "$AU_PACKAGE/SHA256.txt"
          {
            echo '### Syntakt universal AU built'
            echo 'Download **Syntakt-AU-universal** from the artifacts below, then unzip Syntakt-AU-universal.zip.'
            echo 'The component contains Intel and ARM code and is ad-hoc signed.'
            echo 'Firmware, auval, and Logic playback still require local testing. See the included AU-BUILD.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Syntakt-AU-universal
          path: ${{ runner.temp }}/syntakt-au-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Syntakt-AU-logs
          path: ${{ runner.temp }}/syntakt-au-logs/
          if-no-files-found: warn
          retention-days: 14
